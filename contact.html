<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>粉紅茶會 - 聯絡我們</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: "Microsoft JhengHei", sans-serif; line-height: 1.6; background-color: #fdfbfb; color: #333; }
    header { background-color: #e88a99; padding: 1rem 2rem; display: flex; justify-content: space-between; align-items: center; }
    header h1 { color: #fff; font-size: 1.5rem; }
    nav a { color: #fff; text-decoration: none; margin-left: 1.5rem; font-weight: bold; }
    nav a:hover { text-decoration: underline; }
    main { max-width: 800px; margin: 2rem auto; padding: 0 1rem; }
    .form-group { margin-bottom: 1.2rem; }
    .form-group label { display: block; margin-bottom: 0.5rem; font-weight: bold; }
    .form-group input, .form-group textarea { width: 100%; padding: 0.8rem; border: 1px solid #ccc; border-radius: 4px; font-size: 1rem; }
    button[type="submit"] { background-color: #e88a99; color: #fff; border: none; padding: 0.8rem 2rem; font-size: 1rem; border-radius: 4px; cursor: pointer; transition: background 0.3s; }
    button[type="submit"]:hover { background-color: #c94a63; }
    footer { text-align: center; padding: 1.5rem; background-color: #eee; margin-top: 3rem; }
  </style>
</head>
<body>

  <header>
    <h1>粉紅茶會</h1>
    <nav>
      <a href="index.html">首頁</a>
      <a href="about.html">公司介紹</a>
      <a href="contact.html">聯絡我們</a>
    </nav>
  </header>

  <main>
    <h2>聯絡我們</h2>
    <p style="margin-bottom: 1.5rem;">請填寫下方表單，我們會儘快透過 Email 回覆您！</p>

    <!-- 請將下面的「你的FORMSPREE_ID」替換為您在 Formspree 取得的 ID 網址 -->
    <form action="https://formspree.io/f/你的FORMSPREE_ID" method="POST">
      <div class="form-group">
        <label for="name">姓名：</label>
        <input type="text" id="name" name="name" placeholder="請輸入您的姓名" required>
      </div>

      <div class="form-group">
        <label for="phone">電話：</label>
        <input type="tel" id="phone" name="phone" placeholder="請輸入您的聯絡電話" required>
      </div>

      <div class="form-group">
        <label for="email">EMAIL：</label>
        <input type="email" id="email" name="email" placeholder="請輸入您的電子信箱" required>
      </div>

      <div class="form-group">
        <label for="message">聯絡內容：</label>
        <textarea id="message" name="message" rows="5" placeholder="請輸入您想告訴我們的內容..." required></textarea>
      </div>

      <button type="submit">送出表單</button>
    </form>
  </main>

  <footer>
    <p>© 2026 粉紅茶會 All Rights Reserved.</p>
  </footer>

</body>
</html>
